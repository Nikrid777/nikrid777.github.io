    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const dropdown = document.getElementById('searchDropdown');
      const resultsContainer = document.getElementById('searchResults');
      const clearBtn = document.getElementById('clearSearchBtn');

      clearBtn.classList.toggle('hidden', q.length === 0);
      if (q.length === 0) { dropdown.classList.add('hidden'); return; }

      const results = TRACKS.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));

      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="px-6 py-4 text-white/50 text-sm">Ничего не найдено</div>';
      } else {
        resultsContainer.innerHTML = results.map(t => `
          <button type="button" onclick="playTrack(${t.id}); clearSearch();" class="w-full flex items-center gap-3.5 px-5 py-2.5 hover:bg-white/10 active:bg-white/15 transition-colors text-left group">
            <div class="w-10 h-10 rounded-xl overflow-hidden shrink-0 bg-white/5">
              <img src="${t.image}" alt="${t.title}" loading="lazy" class="w-full h-full object-cover" data-vid="${typeof track !== 'undefined' && track ? (track.videoId || '') : (typeof t !== 'undefined' && t ? (t.videoId || '') : '')}" onerror="handleImgError(this)">
            </div>
            <div class="min-w-0 flex-1">
              <div class="font-medium text-sm truncate text-white/90 group-hover:text-white">${t.title}</div>
              <div class="text-xs truncate text-white/50 mt-0.5">${t.artist}</div>
            </div>
            <span class="text-xs text-white/30 tabular-nums">${t.duration}</span>
          </button>
        `).join('');
      }
      dropdown.classList.remove('hidden');
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('searchDropdown').classList.add('hidden');
    }

    function recordTrackInHistory(track) {
      if (!track) return;
      state.history = [track, ...state.history.filter(t => t.id !== track.id)].slice(0, 8);
    }

    async function startAudioSource(srcUrl, reqId) {
      if (!srcUrl || reqId !== state.playRequestId) return;
      audio.pause();
      audio.src = srcUrl;
      audio.volume = state.isMuted ? 0 : state.volume / 100;
      audio.load();

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        try {
          await playPromise;
        } catch (err) {
          if (reqId !== state.playRequestId) return;
          if (err && err.name === 'AbortError') return;
          scheduleStallWatchdog();
        }
      }
    }

    async function playTrack(id, recordHistory = true, queueContext = null) {
      if (queueContext === 'wave') {
        const w = getWaveTracks();
        if (w.length > 0) {
          state.queue = [...w];
          state.customQueueOrder = state.queue.map(t => t.id);
        }
      } else if (queueContext === 'playlist') {
        const p = getPlaylistTracks();
        if (p.length > 0) {
          state.queue = [...p];
          state.customQueueOrder = state.queue.map(t => t.id);
        }
      } else if (queueContext === 'buffer-like' && state.bufferLikes.length > 0) {
        state.queue = [...state.bufferLikes];
        state.customQueueOrder = state.queue.map(t => t.id);
      } else if (queueContext === 'buffer-dislike' && state.bufferDislikes.length > 0) {
        state.queue = [...state.bufferDislikes];
        state.customQueueOrder = state.queue.map(t => t.id);
      }

      const found = state.queue.find(t => t.id === id) || TRACKS.find(t => t.id === id);
      if (!found) return;

      // Если переключаем с трека Моей волны — сразу считаем его прослушанным
      if (state.currentTrack && state.currentTrack.id !== found.id && state.currentTrack.source === 'wave' && state.isPlaying) {
        markTrackAsListened(state.currentTrack);
      }

      const reqId = ++state.playRequestId;
      clearTimeout(state.stallTimerId);

      state.currentTrack = found;
      state.progress = 0;
      state.isPlaying = true;
      state.reconnectAttempts = 0;

      if (recordHistory) recordTrackInHistory(found);

      audio.pause();
      saveState(true);
      updatePlayerUI();
      renderContent();

      if (!navigator.onLine) {
        showToast('Проверка сети при смене VPN...', 'warn', null, null, 2000);
      }

      if (!found.yadiskPublicUrl) {
        skipBrokenTrack('Трек недоступен');
        return;
      }

      try {
        scheduleStallWatchdog();
        const directUrl = await resolveYadiskAudioUrl(found, false);
        if (reqId !== state.playRequestId || !state.isPlaying) return;
        await startAudioSource(directUrl, reqId);
      } catch (e) {
        if (reqId !== state.playRequestId) return;
        if (state.isPlaying) {
          reconnectCurrentStream();
        } else {
          clearTimeout(state.stallTimerId);
          updatePlayerUI();
          showToast(`Ошибка Яндекс Диска: ${e.message}`, 'error', 'Повторить', () => playTrack(found.id, false), 6000);
        }
      }
    }

    function togglePlay() {
      if (!state.currentTrack) return;
      state.isPlaying = !state.isPlaying;

      if (state.isPlaying) {
        if (!audio.src) {
          playTrack(state.currentTrack.id, false);
          return;
        }
        state.reconnectAttempts = 0;
        scheduleStallWatchdog();
        const p = audio.play();
        if (p !== undefined) {
          p.catch((err) => {
            if (err && err.name === 'AbortError') return;
            reconnectCurrentStream();
          });
        }
      } else {
        clearTimeout(state.stallTimerId);
        audio.pause();
      }

      updatePlayerUI();
      renderContent();
    }

    function nextTrack(fromError = false) {
      if (!state.queue.length) return;
      if (!fromError) {
        state.consecutiveErrors = 0;
        if (state.currentTrack && state.currentTrack.source === 'wave') {
          markTrackAsListened(state.currentTrack);
        }
      }
      const idx = state.queue.findIndex(t => t.id === (state.currentTrack && state.currentTrack.id));
      const nextIdx = (idx + 1) % state.queue.length;
      playTrack(state.queue[nextIdx].id);
    }

    function prevTrack() {
      if (!state.queue.length) return;
      const curSec = (state.progress / 100) * (state.currentTrack ? state.currentTrack.seconds : 0);
      if (curSec > 3) {
        seekTrack(0, true);
        return;
      }
      const idx = state.queue.findIndex(t => t.id === (state.currentTrack && state.currentTrack.id));
      const prevIdx = (idx - 1 + state.queue.length) % state.queue.length;
      playTrack(state.queue[prevIdx].id);
    }

    function actionLike() {
      if (!state.currentTrack) return;
      actionLikeBtn(state.currentTrack.id);
    }

    function actionDislike() {
      if (!state.currentTrack) return;
      actionDislikeBtn(state.currentTrack.id);
    }

    function actionLikeBtn(id) {
      const track = TRACKS.find(t => t.id === id);
      if (!track) return;
      const exists = state.bufferLikes.some(t => t.id === id);
      if (exists) {
        state.bufferLikes = state.bufferLikes.filter(t => t.id !== id);
        if (track.source !== 'playlist') track.liked = false;
      } else {
        state.bufferLikes.push(track);
        track.liked = true;
        state.bufferDislikes = state.bufferDislikes.filter(t => t.id !== id);
      }
      saveState(true);
      updatePlayerUI();
      renderContent();
    }

    function actionDislikeBtn(id) {
      const track = TRACKS.find(t => t.id === id);
      if (!track) return;
      const exists = state.bufferDislikes.some(t => t.id === id);
      if (exists) {
        state.bufferDislikes = state.bufferDislikes.filter(t => t.id !== id);
      } else {
        state.bufferDislikes.push(track);
        track.liked = false;
        state.bufferLikes = state.bufferLikes.filter(t => t.id !== id);
      }
      saveState(true);
      updatePlayerUI();
      renderContent();
    }

    function startSeekDrag() {
      state.isDraggingProgress = true;
    }

    function seekTrack(val, commitAudio = false) {
      state.progress = Math.max(0, Math.min(100, Number(val)));
      syncProgressUI();

      if (audio.duration && !isNaN(audio.duration)) {
        audio.currentTime = (state.progress / 100) * audio.duration;
      }
      if (commitAudio) state.isDraggingProgress = false;
    }

    function syncProgressUI() {
      const pct = state.progress + '%';
      document.getElementById('progress-slider').value = state.progress;
      document.getElementById('progress-fill').style.width = pct;
      document.getElementById('progress-thumb').style.left = pct;
      updateTime();
    }

    function setVolume(val) {
      const num = Math.max(0, Math.min(100, Number(val)));
      state.volume = num;
      if (num > 0) {
        state.prevVolume = num;
        state.isMuted = false;
      } else {
        state.isMuted = true;
      }
      audio.volume = state.isMuted ? 0 : state.volume / 100;
      saveState(false);
      updateVolumeUI();
    }

    function handleVolumeWheel(e) {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 5 : -5;
      const current = state.isMuted ? 0 : state.volume;
      setVolume(current + delta);
    }

    function toggleMute() {
      if (state.isMuted || state.volume === 0) {
        state.isMuted = false;
        state.volume = state.prevVolume > 0 ? state.prevVolume : 70;
      } else {
        state.prevVolume = state.volume;
        state.isMuted = true;
      }
      audio.volume = state.isMuted ? 0 : state.volume / 100;
      saveState(false);
      updateVolumeUI();
    }

    function updateVolumeUI() {
      const effectiveVol = state.isMuted ? 0 : state.volume;
      const slider = document.getElementById('vol-slider');
      const fill = document.getElementById('vol-fill');
      const thumb = document.getElementById('vol-thumb');
      if (slider) slider.value = effectiveVol;
      if (fill) fill.style.width = effectiveVol + '%';
      if (thumb) thumb.style.left = effectiveVol + '%';

      const volIcon = document.getElementById('vol-icon');
      if (!volIcon) return;
      if (effectiveVol === 0) {
        volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
      } else if (effectiveVol < 50) {
        volIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
      } else {
        volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    }

    function updateTime() {
      if (!state.currentTrack) return;
      const totalSec = (audio.duration && !isNaN(audio.duration)) ? audio.duration : state.currentTrack.seconds;
      const curSec = Math.floor((state.progress / 100) * totalSec);
      const m = Math.floor(curSec / 60);
      const s = String(curSec % 60).padStart(2, '0');
      document.getElementById('time-current').textContent = `${m}:${s}`;
    }

    function updatePlayerUI() {
      const t = state.currentTrack;
      if (!t) return;

      document.getElementById('player-title').textContent = t.title;
      document.getElementById('player-artist').textContent = t.artist;
      const pImg = document.getElementById('player-cover-img');
      pImg.dataset.errStage = '0';
      pImg.dataset.vid = t.videoId || '';
      pImg.onerror = function() { handleImgError(this, t.videoId || ''); };
      pImg.src = t.image || DEFAULT_COVER_SVG;

      document.getElementById('time-total').textContent = t.duration;

      const spImg = document.getElementById('sp-cover-img');
      spImg.dataset.errStage = '0';
      spImg.dataset.vid = t.videoId || '';
      spImg.onerror = function() { handleImgError(this, t.videoId || ''); };
      spImg.src = t.image || DEFAULT_COVER_SVG;

      document.getElementById('sp-main-title').textContent = t.title;
      document.getElementById('sp-main-artist').textContent = t.artist;
      document.getElementById('sp-cover-mood').textContent = 'Весёлая';
      const isWaveQueue = state.queue.length > 0 && state.queue.every(q => q.source === 'wave');
      document.getElementById('sp-source').textContent = isWaveQueue ? 'Моя волна (Весёлая)' : (state.activeTab === 'wave' ? 'Моя волна (Весёлая)' : 'Плейлист');

      const likeBtn = document.getElementById('player-like-btn');
      const dislikeBtn = document.getElementById('player-dislike-btn');
      const mobLikeBtn = document.getElementById('sp-mob-like');
      const mobDislikeBtn = document.getElementById('sp-mob-dislike');

      const liked = isTrackLiked(t);
      const disliked = state.bufferDislikes.some(track => track.id === t.id);

      const likeSvg = liked
        ? '<svg class="w-5 h-5 neon-color" fill="currentColor" viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>'
        : '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>';

      const dislikeSvg = disliked
        ? '<svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>'
        : '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>';

      if (likeBtn) likeBtn.innerHTML = likeSvg;
      if (dislikeBtn) dislikeBtn.innerHTML = dislikeSvg;
      if (mobLikeBtn) mobLikeBtn.innerHTML = likeSvg;
      if (mobDislikeBtn) mobDislikeBtn.innerHTML = dislikeSvg;

      document.getElementById('icon-play').classList.toggle('hidden', state.isPlaying);
      document.getElementById('icon-pause').classList.toggle('hidden', !state.isPlaying);

      syncProgressUI();
      renderQueue(true);
    }

    function syncToggleButtonsUI() {
      ['btn-repeat', 'mob-btn-repeat'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.classList.toggle('text-[var(--neon)]', state.repeat);
        btn.classList.toggle('text-gray-500', !state.repeat);
        btn.classList.toggle('text-gray-400', !state.repeat);
      });

      ['btn-shuffle', 'sp-mob-shuffle'].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.classList.toggle('text-[var(--neon)]', state.shuffle);
        btn.classList.toggle('text-gray-500', !state.shuffle);
        btn.classList.toggle('text-gray-400', !state.shuffle);
      });

      const spBtn = document.getElementById('sp-btn-shuffle');
      const spLabel = document.getElementById('sp-shuffle-label');
      if (spBtn && spLabel) {
        spBtn.classList.toggle('neon-nav-active', state.shuffle);
        spLabel.textContent = state.shuffle ? 'Перемешано' : 'Перемешать';
      }
    }

    function toggleRepeat() {
      state.repeat = !state.repeat;
      syncToggleButtonsUI();
      saveState(false);
    }

    function toggleShuffle() {
      state.shuffle = !state.shuffle;

      if (state.shuffle) {
        state.customQueueOrder = state.queue.map(t => t.id);
        const others = state.queue.filter(t => t.id !== state.currentTrack.id);
        for (let i = others.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [others[i], others[j]] = [others[j], others[i]];
        }
        state.queue = [state.currentTrack, ...others];
      } else {
        const restored = state.customQueueOrder
          .map(id => TRACKS.find(t => t.id === id))
          .filter(Boolean);
        state.queue = restored.length > 0 ? restored : [...TRACKS];
      }

      syncToggleButtonsUI();
      saveState(false);
      renderQueue();
    }

    function toggleSongPage(force) {
      if (force !== undefined) state.isSongPageOpen = force;
      else state.isSongPageOpen = !state.isSongPageOpen;

      const page = document.getElementById('song-page');
      const footer = document.getElementById('player-footer');
      const chevron = document.getElementById('player-chevron');

      if (state.isSongPageOpen) {
        page.classList.remove('translate-y-full');
        page.classList.add('translate-y-0');
        footer.classList.remove('bottom-[66px]');
        footer.classList.add('bottom-3');
        if (chevron) chevron.classList.remove('rotate-180');
        renderQueue(true);
      } else {
        page.classList.add('translate-y-full');
        page.classList.remove('translate-y-0');
        footer.classList.add('bottom-[66px]');
        footer.classList.remove('bottom-3');
        if (chevron) chevron.classList.add('rotate-180');
      }
    }

    function moveQueueItem(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= state.queue.length) return;
      const temp = state.queue[index];
      state.queue[index] = state.queue[targetIndex];
      state.queue[targetIndex] = temp;
      if (!state.shuffle) state.customQueueOrder = state.queue.map(t => t.id);
      saveState(false);
      renderQueue();
    }

    function startVisualizerLoop() {
      const canvas = document.getElementById('audio-visualizer');
      const glowEl = document.getElementById('sp-cover-glow');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const bars = 28;
      const heights = new Array(bars).fill(4);
      let smoothEnergy = 0;

      function draw() {
        if (document.hidden) {
          requestAnimationFrame(draw);
          return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const neonColor = getComputedStyle(document.documentElement).getPropertyValue('--neon').trim() || '#10B981';
        const barWidth = 5;
        const gap = 4;
        const totalWidth = bars * barWidth + (bars - 1) * gap;
        const startX = (canvas.width - totalWidth) / 2;
        const now = performance.now() / 150;

        let energySum = 0;

        for (let i = 0; i < bars; i++) {
          let target = 4;
          if (state.isPlaying && !state.isMuted && state.volume > 0) {
            const centerFactor = 1 - Math.abs(i - bars / 2) / (bars / 2);
            const wave = Math.sin(now + i * 0.55) * 0.5 + 0.5;
            const pulse = Math.cos(now * 1.65 - i * 0.35) * 0.5 + 0.5;
            const bassKick = Math.pow(Math.sin(now * 0.9) * 0.5 + 0.5, 2);
            target = Math.max(4, (wave * 0.5 + pulse * 0.3 + bassKick * 0.2) * centerFactor * 34 * (state.volume / 100) + 4);
          }
          heights[i] += (target - heights[i]) * 0.25;
          energySum += heights[i];

          const h = heights[i];
          const x = startX + i * (barWidth + gap);
          const y = (canvas.height - h) / 2;

          ctx.fillStyle = neonColor;
          ctx.globalAlpha = state.isPlaying ? 0.88 : 0.25;
          ctx.beginPath();
          ctx.roundRect(x, y, barWidth, h, 3);
          ctx.fill();
        }

        if (glowEl) {
          const avgEnergy = (energySum / bars - 4) / 22;
          smoothEnergy += (avgEnergy - smoothEnergy) * 0.18;

          if (state.isPlaying && !state.isMuted && state.volume > 0) {
            const scale = 1.02 + smoothEnergy * 0.26;
            const shiftX = Math.sin(now * 0.7) * (10 + smoothEnergy * 14);
            const shiftY = Math.cos(now * 0.55) * (10 + smoothEnergy * 14);
            const blurPx = Math.round(28 + smoothEnergy * 34);
            const opacity = Math.min(0.85, 0.32 + smoothEnergy * 0.5);

            glowEl.style.transform = `translate3d(${shiftX.toFixed(1)}px, ${shiftY.toFixed(1)}px, 0) scale(${scale.toFixed(3)})`;
            glowEl.style.filter = `blur(${blurPx}px)`;
            glowEl.style.opacity = opacity.toFixed(2);
            glowEl.style.background = neonColor;
          } else {
            glowEl.style.transform = 'translate3d(0px, 0px, 0) scale(0.96)';
            glowEl.style.filter = 'blur(26px)';
            glowEl.style.opacity = '0.18';
            glowEl.style.background = neonColor;
          }
        }

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }

    let draggedTrackId = null;
    let autoScrollVelocity = 0;
    let autoScrollFrame = null;

    function runQueueAutoScroll() {
      const container = document.getElementById('sp-queue');
      if (!container || !draggedTrackId) {
        autoScrollFrame = null;
        return;
      }
      if (autoScrollVelocity !== 0) container.scrollTop += autoScrollVelocity;
      autoScrollFrame = requestAnimationFrame(runQueueAutoScroll);
    }

    function handleQueueContainerDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const container = document.getElementById('sp-queue');
      if (!container || !draggedTrackId) return;

      const rect = container.getBoundingClientRect();
      const edgeSize = 90;
      const y = e.clientY;

      if (y < rect.top + edgeSize) {
        const intensity = Math.max(0.15, (rect.top + edgeSize - y) / edgeSize);
        autoScrollVelocity = -Math.round(intensity * 16);
      } else if (y > rect.bottom - edgeSize) {
        const intensity = Math.max(0.15, (y - (rect.bottom - edgeSize)) / edgeSize);
        autoScrollVelocity = Math.round(intensity * 16);
      } else {
        autoScrollVelocity = 0;
      }

      const targetItem = e.target.closest('.queue-item');
      if (!targetItem) return;

      const targetId = parseInt(targetItem.dataset.id);
      if (!targetId || targetId === draggedTrackId) return;

      const itemRect = targetItem.getBoundingClientRect();
      const midpoint = itemRect.top + itemRect.height / 2;

      const draggedIdx = state.queue.findIndex(t => t.id === draggedTrackId);
      const targetIdx = state.queue.findIndex(t => t.id === targetId);
      if (draggedIdx === -1 || targetIdx === -1) return;

      if ((draggedIdx < targetIdx && y > midpoint - 6) || (draggedIdx > targetIdx && y < midpoint + 6)) {
        const [moved] = state.queue.splice(draggedIdx, 1);
        state.queue.splice(targetIdx, 0, moved);
        state.customQueueOrder = state.queue.map(t => t.id);
        renderQueue();
      }
    }

    function handleDragStart(e) {
      draggedTrackId = parseInt(this.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(draggedTrackId));
      setTimeout(() => this.classList.add('dragging-active'), 0);
      if (!autoScrollFrame) autoScrollFrame = requestAnimationFrame(runQueueAutoScroll);
    }

    function handleDragEnd() {
      draggedTrackId = null;
      autoScrollVelocity = 0;
      if (autoScrollFrame) {
        cancelAnimationFrame(autoScrollFrame);
        autoScrollFrame = null;
      }
      saveState(false);
      renderQueue();
    }

    function scrollQueueToActiveTrack(container) {
      if (!container) return;
      const activeEl = container.querySelector('.queue-active-item');
      if (!activeEl) return;
      const targetTop = Math.max(0, activeEl.offsetTop - (container.clientHeight * 0.35) + (activeEl.clientHeight * 0.5));
      container.scrollTo({ top: targetTop, behavior: 'smooth' });
    }

    function renderQueue(shouldScrollToActive = false) {
      const container = document.getElementById('sp-queue');
      if (!container) return;

      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
      container.ondragover = isDesktop ? handleQueueContainerDragOver : null;
      container.ondrop = isDesktop ? (e) => { e.preventDefault(); handleDragEnd(); } : null;

      container.innerHTML = state.queue.map((track, idx) => {
        const isCur = track.id === (state.currentTrack && state.currentTrack.id);
        const isDraggingThis = track.id === draggedTrackId;
        return `
          <div ${isDesktop ? 'draggable="true"' : ''} data-id="${track.id}" onclick="playTrack(${track.id})" class="queue-item group flex items-center gap-3 px-3.5 py-2.5 rounded-2xl hover:bg-white/10 cursor-grab active:cursor-grabbing transition-colors duration-150 ${isCur ? 'queue-active-item bg-white/[0.12]' : ''} ${isDraggingThis ? 'dragging-active' : ''}">
             <div class="hidden lg:flex w-5 justify-center text-gray-400 opacity-60 group-hover:opacity-100 hover:text-white transition-opacity">
               <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
             </div>
             <div class="relative w-10 h-10 sm:w-11 sm:h-11 rounded-xl shadow flex-shrink-0 overflow-hidden bg-white/5">
               <img src="${track.image}" alt="${track.title}" loading="lazy" decoding="async" class="w-full h-full object-cover" data-vid="${typeof track !== 'undefined' && track ? (track.videoId || '') : (typeof t !== 'undefined' && t ? (t.videoId || '') : '')}" onerror="handleImgError(this)">
               ${isCur ? (state.isPlaying ? '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></div>' : '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>') : '<div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>'}
             </div>
             <div class="flex flex-col flex-1 min-w-0">
               <div class="text-[13px] sm:text-[14px] truncate ${isCur ? 'active-track-title' : 'text-gray-200 font-medium'}">${track.title}</div>
               <div class="text-[11px] sm:text-[12px] truncate text-gray-500 mt-0.5">${track.artist}</div>
             </div>
             <div class="queue-interactive flex lg:hidden items-center gap-1 text-gray-500" onclick="event.stopPropagation()">
               <button type="button" onclick="moveQueueItem(${idx}, -1)" class="p-1.5 hover:text-white active:scale-90"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg></button>
               <button type="button" onclick="moveQueueItem(${idx}, 1)" class="p-1.5 hover:text-white active:scale-90"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></button>
             </div>
             <div class="flex items-center gap-1.5 justify-end shrink-0">
               ${renderPrefetchDot(track)}
               <span class="text-xs tabular-nums text-gray-500 w-9 text-right">${track.duration}</span>
             </div>
          </div>
        `;
      }).join('');

      if (isDesktop) {
        container.querySelectorAll('.queue-item').forEach(item => {
          item.addEventListener('dragstart', handleDragStart);
          item.addEventListener('dragend', handleDragEnd);
        });
      }

      if (shouldScrollToActive) {
        requestAnimationFrame(() => scrollQueueToActiveTrack(container));
      }
    }

    window.onload = init;
  </script>
</body>
</html>
