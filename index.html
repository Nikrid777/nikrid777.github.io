<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Nikrid — Sci-Fi Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">

  <style>
    :root {
      --neon: #10B981;
      --bg-base: #000000;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior-y: contain;
    }

    button, input {
      border: 0 !important;
      outline: none !important;
      box-shadow: none;
      -webkit-appearance: none;
      appearance: none;
    }
    button:focus, button:focus-visible, button:active,
    input:focus, input:focus-visible, input:active {
      outline: none !important;
      border: 0 !important;
    }

    img {
      image-rendering: -webkit-optimize-contrast;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .neon-text { color: var(--neon); text-shadow: 0 0 12px var(--neon); }
    .neon-bg { background-color: var(--neon); box-shadow: 0 0 15px var(--neon); }
    .neon-color { color: var(--neon); }

    .active-track-title {
      color: var(--neon);
      font-weight: 800;
    }

    .nav-btn {
      background-color: transparent;
      color: rgba(255, 255, 255, 0.5);
      transition: background-color 0.16s ease, color 0.16s ease;
      transform: translateZ(0);
      backface-visibility: hidden;
      will-change: background-color, color;
    }
    @media (hover: hover) {
      .nav-btn:hover:not(.neon-nav-active) {
        background-color: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.92);
      }
    }
    .nav-btn.neon-nav-active {
      background-color: var(--neon) !important;
      color: #000000 !important;
      box-shadow: 0 0 22px color-mix(in srgb, var(--neon) 32%, transparent);
    }
    .nav-btn.neon-nav-active svg {
      stroke: #000000 !important;
      fill: none;
    }

    .range-overlay {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 100%;
      background: transparent;
      outline: none;
      margin: 0;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      z-index: 20;
      touch-action: none;
    }

    #progress-fill, #progress-thumb, #vol-fill, #vol-thumb {
      transition: none !important;
      will-change: width, left;
    }

    .queue-item * {
      pointer-events: none;
    }
    .queue-item .queue-interactive {
      pointer-events: auto;
    }
    .queue-item.dragging-active {
      opacity: 0.35;
      background-color: rgba(255, 255, 255, 0.16) !important;
      box-shadow: inset 0 0 0 1px var(--neon);
    }

    #ptr-indicator {
      transition: transform 0.18s ease, opacity 0.18s ease;
      will-change: transform, opacity;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-item {
      animation: toastIn 0.22s ease-out forwards;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body class="h-[100dvh] flex flex-col select-none relative">

  <audio id="audio-engine" preload="metadata"></audio>

  <!-- PULL-TO-REFRESH ИНДИКАТОР (Мобильный свайп вниз) -->
  <div id="ptr-indicator" class="fixed top-2 left-1/2 -translate-x-1/2 z-[70] pointer-events-none opacity-0 -translate-y-12">
    <div class="flex items-center gap-2.5 px-4 py-2 rounded-full bg-[#0D0D0D]/95 backdrop-blur-2xl shadow-[0_8px_30px_rgba(0,0,0,0.9)]">
      <svg id="ptr-spinner" class="w-4 h-4 text-[var(--neon)] transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <span id="ptr-text" class="text-xs font-semibold text-white/90">Потяните для обновления</span>
    </div>
  </div>

  <!-- КОНТЕЙНЕР ОШИБОК И УВЕДОМЛЕНИЙ -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[80] w-[92%] max-w-md flex flex-col gap-2 pointer-events-none"></div>

  <!-- ФОНОВЫЕ ЭФФЕКТЫ -->
  <div class="fixed top-1/4 left-1/4 w-[50vw] md:w-[30vw] h-[50vw] md:h-[30vw] rounded-full blur-[120px] md:blur-[150px] opacity-[0.05] pointer-events-none transition-colors duration-1000 z-0" style="background-color: var(--neon);"></div>
  <div class="fixed bottom-1/4 right-1/4 w-[60vw] md:w-[40vw] h-[60vw] md:h-[40vw] rounded-full blur-[120px] md:blur-[150px] opacity-[0.05] pointer-events-none transition-colors duration-1000 z-0" style="background-color: var(--neon);"></div>

  <div class="fixed top-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full border border-white opacity-[0.02] pointer-events-none z-0"></div>
  <div class="fixed top-[-10%] left-[10%] w-[40vw] h-[40vw] rounded-full border border-white opacity-[0.02] pointer-events-none z-0"></div>

  <svg class="fixed bottom-0 right-0 w-[65vw] md:w-[45vw] h-auto opacity-[0.03] pointer-events-none z-0 text-white" viewBox="0 0 200 200" fill="currentColor">
    <path d="M200 200 C 150 140, 90 100, 0 90 C 70 100, 130 130, 170 180 Z" />
    <path d="M200 200 C 160 160, 120 120, 30 130 C 80 140, 140 160, 180 190 Z" />
    <path d="M200 200 C 180 150, 140 100, 60 70 C 100 90, 150 130, 190 170 Z" />
    <path d="M200 200 C 170 170, 130 140, 50 150 C 90 160, 150 180, 185 195 Z" />
  </svg>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="shrink-0 flex flex-wrap lg:flex-nowrap items-center justify-between px-4 sm:px-8 pt-3 pb-2.5 lg:py-0 lg:h-24 gap-y-2.5 relative z-30">
    <div class="order-1 lg:w-1/4 flex items-center gap-3">
      <div class="flex items-center gap-2.5 sm:gap-3 cursor-pointer" onclick="switchTab('wave'); toggleSongPage(false);">
        <svg class="w-8 h-8 sm:w-9 sm:h-9 neon-text transition-colors duration-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 22V8m4 14V4m4 18v-8m4 8V10m4 12V2"/>
        </svg>
        <span class="font-extrabold text-xl sm:text-2xl tracking-[0.2em] uppercase neon-text transition-colors duration-500">Nikrid</span>
      </div>
      <div id="net-status-pill" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/5 text-[10px] font-semibold text-white/60">
        <span id="net-status-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="net-status-text">Яндекс Диск</span>
      </div>
    </div>

    <!-- ПОИСК -->
    <div class="order-3 lg:order-2 w-full lg:w-auto lg:flex-1 lg:max-w-lg lg:mx-auto z-40" id="searchContainer">
      <div class="relative flex items-center group w-full">
        <svg class="w-4 h-4 sm:w-5 sm:h-5 absolute left-4 sm:left-5 text-white/50 group-focus-within:text-white transition-colors pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Поиск треков, альбомов и исполнителей..."
               class="w-full h-10 sm:h-12 pl-11 sm:pl-14 pr-10 rounded-full bg-white/5 hover:bg-white/10 focus:bg-white/15 text-xs sm:text-sm text-white placeholder-white/40 transition-colors">
        <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-4 text-white/40 hover:text-white p-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="searchDropdown" class="hidden absolute left-4 right-4 lg:left-1/2 lg:-translate-x-1/2 lg:w-full lg:max-w-lg mt-2 rounded-[1.75rem] bg-[#0A0A0A]/95 backdrop-blur-2xl py-2.5 z-50 max-h-80 overflow-y-auto shadow-[0_15px_40px_rgba(0,0,0,0.95)]">
        <div id="searchResults" class="flex flex-col"></div>
      </div>
    </div>

    <!-- КНОПКИ СПРАВА -->
    <div class="order-2 lg:order-3 lg:w-1/4 flex items-center justify-end gap-2 sm:gap-2.5 relative z-50">
      <div class="relative" id="moodMenuWrapper">
        <button type="button" onclick="toggleMenu('moodMenu')" class="flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-full bg-white/5 hover:bg-white/10 active:bg-white/15 transition-colors text-xs sm:text-sm font-medium">
          <span id="currentMoodLabel" class="truncate max-w-[90px] sm:max-w-none">Весёлая</span>
          <svg class="w-3.5 h-3.5 text-white/50 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="moodMenu" class="hidden absolute top-full right-0 mt-2.5 w-48 rounded-[1.75rem] bg-[#0A0A0A]/95 backdrop-blur-2xl py-2.5 z-50 shadow-[0_15px_40px_rgba(0,0,0,0.95)]">
          <button type="button" onclick="selectMood('Весёлая')" class="w-full text-left px-5 py-2.5 text-xs sm:text-sm text-[var(--neon)] font-semibold hover:bg-white/10 transition-colors flex items-center justify-between">
            <span>Весёлая</span>
            <span class="w-2 h-2 rounded-full neon-bg"></span>
          </button>
        </div>
      </div>

      <div class="relative" id="colorMenuWrapper">
        <button type="button" onclick="toggleMenu('colorMenu')" class="flex items-center gap-1.5 px-3 sm:px-4 py-2 sm:py-2.5 rounded-full bg-white/5 hover:bg-white/10 active:bg-white/15 transition-colors text-xs sm:text-sm font-medium">
          <span class="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full transition-colors duration-500 neon-bg"></span>
          <svg class="w-3.5 h-3.5 text-white/50 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="colorMenu" class="hidden absolute top-full right-0 mt-2.5 w-52 rounded-[1.75rem] bg-[#0A0A0A]/95 backdrop-blur-2xl py-2.5 z-50 shadow-[0_15px_40px_rgba(0,0,0,0.95)]">
          <button type="button" onclick="selectTheme('#E879C5')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#E879C5]"></span> Обсидиан</button>
          <button type="button" onclick="selectTheme('#E5C185')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#E5C185]"></span> Графит</button>
          <button type="button" onclick="selectTheme('#F7F7F9')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#F7F7F9]"></span> Молочный</button>
          <button type="button" onclick="selectTheme('#60A5FA')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#60A5FA]"></span> Северный</button>
          <button type="button" onclick="selectTheme('#EA580C')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#EA580C]"></span> Тёплый</button>
          <button type="button" onclick="selectTheme('#10B981')" class="w-full flex items-center gap-3.5 px-5 py-2.5 text-xs sm:text-sm hover:bg-white/10 transition-colors"><span class="w-3 h-3 rounded-full bg-[#10B981]"></span> Изумрудный</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
  <div class="flex flex-1 overflow-hidden z-10 relative">
    <aside class="hidden md:flex w-64 lg:w-72 shrink-0 flex-col p-6 gap-2">
      <nav class="flex flex-col gap-2 mt-2">
        <button type="button" onclick="switchTab('wave')" id="tab-wave" class="nav-btn neon-nav-active flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/></svg>
          <span>Моя волна</span>
        </button>
        <button type="button" onclick="switchTab('playlist')" id="tab-playlist" class="nav-btn flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Плейлист</span>
        </button>
        <button type="button" onclick="switchTab('buffer-like')" id="tab-like" class="nav-btn flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
          <span class="truncate">Буфер: Лайк</span>
          <span id="badge-like" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-black/25 font-bold hidden">0</span>
        </button>
        <button type="button" onclick="switchTab('buffer-dislike')" id="tab-dislike" class="nav-btn flex items-center gap-4 px-5 py-3.5 rounded-full font-medium">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
          <span class="truncate">Буфер: Дизлайк</span>
          <span id="badge-dislike" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-black/25 font-bold hidden">0</span>
        </button>
      </nav>
    </aside>

    <main id="main-content" class="flex-1 overflow-y-scroll px-3.5 sm:px-8 lg:px-10 py-2 sm:py-6 pb-[165px] md:pb-36"></main>
  </div>

  <!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->
  <nav id="mobile-nav" class="md:hidden fixed bottom-2.5 left-1/2 -translate-x-1/2 w-[95%] h-[54px] rounded-full bg-[#0A0A0A]/95 backdrop-blur-2xl z-30 flex items-center justify-between px-1.5 shadow-[0_10px_30px_rgba(0,0,0,0.9)]">
    <button type="button" onclick="switchTab('wave')" id="mob-tab-wave" class="nav-btn neon-nav-active flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/></svg>
      <span>Волна</span>
    </button>
    <button type="button" onclick="switchTab('playlist')" id="mob-tab-playlist" class="nav-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Плейлист</span>
    </button>
    <button type="button" onclick="switchTab('buffer-like')" id="mob-tab-like" class="nav-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
      <span>Лайк</span>
    </button>
    <button type="button" onclick="switchTab('buffer-dislike')" id="mob-tab-dislike" class="nav-btn flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-[11px] font-semibold">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
      <span>Дизлайк</span>
    </button>
  </nav>

  <!-- СТРАНИЦА ТРЕКА -->
  <div id="song-page" class="fixed inset-0 z-40 bg-[#000000]/95 backdrop-blur-3xl flex flex-col lg:flex-row transition-transform duration-500 ease-out translate-y-full pt-3 sm:pt-6 lg:pt-20 pb-[96px] md:pb-[125px] px-4 sm:px-8 md:px-14 overflow-hidden">
    <div class="flex lg:hidden items-center justify-between w-full mb-3 px-1 shrink-0">
      <button type="button" onclick="toggleSongPage(false)" class="p-2.5 rounded-full bg-white/5 text-white active:scale-95 transition">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
      </button>
      <div class="flex bg-white/5 p-1 rounded-full gap-1">
        <button type="button" onclick="switchMobileSongView('cover')" id="mob-view-cover" class="nav-btn neon-nav-active px-5 py-1.5 rounded-full text-xs font-bold">Трек</button>
        <button type="button" onclick="switchMobileSongView('queue')" id="mob-view-queue" class="nav-btn px-5 py-1.5 rounded-full text-xs font-bold">Очередь</button>
      </div>
      <button type="button" onclick="toggleRepeat()" id="mob-btn-repeat" class="p-2.5 rounded-full bg-white/5 text-gray-400 transition">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="w-full flex-1 max-w-[1550px] mx-auto flex flex-col lg:flex-row items-center gap-6 lg:gap-14 overflow-hidden">
      <div id="sp-left-panel" class="flex lg:!flex flex-1 flex-col items-center justify-center w-full h-full overflow-hidden">
        <div class="relative flex items-center justify-center my-4">
          <div id="sp-cover-glow" class="absolute -inset-6 rounded-[2.8rem] opacity-30 blur-2xl pointer-events-none will-change-transform" style="background: var(--neon);"></div>

          <div id="sp-cover-wrap" class="relative w-[54vw] h-[54vw] max-w-[240px] max-h-[240px] sm:max-w-[310px] sm:max-h-[310px] lg:max-w-[430px] lg:max-h-[430px] lg:w-[44vh] lg:h-[44vh] rounded-[2rem] overflow-hidden shadow-[0_25px_70px_rgba(0,0,0,0.9)] bg-white/5 shrink-0 z-10">
            <img id="sp-cover-img" src="" alt="Album Cover" class="w-full h-full object-cover" onerror="handleImgError(this)">
            <div id="sp-cover-mood" class="absolute top-3.5 left-3.5 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-black/65 backdrop-blur-md text-[var(--neon)]">
              Весёлая
            </div>
          </div>
        </div>

        <div class="flex flex-col items-center text-center w-full max-w-lg mt-4 sm:mt-6 px-2 z-10">
          <h2 id="sp-main-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-white tracking-tight truncate w-full drop-shadow">Выберите трек</h2>
          <p id="sp-main-artist" class="text-xs sm:text-sm lg:text-base text-white/60 font-medium truncate w-full mt-1">Исполнитель</p>

          <div class="w-48 sm:w-64 h-8 sm:h-10 mt-3 flex items-center justify-center">

  <script>
    const STORAGE_KEY = 'nikrid_radio_state_v3';
    const PLAYLIST_CACHE_KEY = 'nikrid_playlist_json_cache_v2';
    const SYNC_CONFIG_KEY = 'nikrid_cloud_sync_cfg_v1';
    const WAVE_LIMIT = 200;
    const YADISK_LINK_TTL_MS = 25 * 60 * 1000;

    const DEFAULT_COVER_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">

        <circle cx="100" cy="100" r="56" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
        <circle cx="100" cy="100" r="16" fill="rgba(255,255,255,0.2)"/>
      </svg>
    `);

    const yadiskUrlCache = new Map();

    function resolveLocalCover(rawImg, videoId = '') {
      if (typeof rawImg === 'string') {
        const s = rawImg.trim();
        if (s.startsWith('covers/') || s.startsWith('./covers/') || s.startsWith('data:') || s.startsWith('http')) {
          return s;
        }
      }
      if (videoId) return `covers/${videoId}.webp`;
      return DEFAULT_COVER_SVG;
    }

    let TRACKS = [
      { id: 1, title: 'Загрузка плейлиста...', artist: 'Nikrid Radio', duration: '0:00', seconds: 1, moods: ['Весёлая'], source: 'playlist', liked: true, image: DEFAULT_COVER_SVG, yadiskPublicUrl: '' }
    ];

    let state = {
      activeTab: 'wave',
      playlistSort: 'added_desc',
      mood: 'Весёлая',
      theme: '#10B981',
      currentTrack: TRACKS[0],
      isPlaying: false,
      progress: 0,
      isDraggingProgress: false,
      volume: 70,
      prevVolume: 70,
      isMuted: false,
      playRequestId: 0,
      stallTimerId: null,
      reconnectAttempts: 0,
      consecutiveErrors: 0,
      lastSyncClearedAt: '',
      bufferLikes: [],
      bufferDislikes: [],
      waveListenedIds: [],
      history: [],
      repeat: false,
      shuffle: false,
      isSongPageOpen: false,
      mobileSongView: 'cover',
      queue: [...TRACKS],
      customQueueOrder: TRACKS.map(t => t.id),
      cloudSyncDebounce: null
    };

    const audio = document.getElementById('audio-engine');

    function showToast(message, type = 'info', actionLabel = null, actionFn = null, duration = 4500) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const existing = Array.from(container.children).find(el => el.dataset.msg === message);
      if (existing) existing.remove();

      const palette = {
        error: { dot: 'bg-red-500', glow: 'shadow-[0_10px_35px_rgba(239,68,68,0.28)]', text: 'text-red-200' },
        warn:  { dot: 'bg-amber-400', glow: 'shadow-[0_10px_35px_rgba(251,191,36,0.22)]', text: 'text-amber-100' },
        ok:    { dot: 'bg-emerald-400', glow: 'shadow-[0_10px_35px_rgba(16,185,129,0.22)]', text: 'text-emerald-100' },
        info:  { dot: 'neon-bg', glow: 'shadow-[0_10px_35px_rgba(0,0,0,0.85)]', text: 'text-white/90' }
      }[type] || { dot: 'neon-bg', glow: '', text: 'text-white' };

      const el = document.createElement('div');
      el.dataset.msg = message;
      el.className = `toast-item pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl bg-[#0C0C0C]/95 backdrop-blur-2xl ${palette.glow}`;
      el.innerHTML = `
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full shrink-0 ${palette.dot}"></span>
          <span class="text-xs sm:text-[13px] font-medium ${palette.text} leading-snug">${message}</span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          ${actionLabel ? `<button type="button" class="toast-action px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 text-[11px] font-bold text-white transition">${actionLabel}</button>` : ''}
          <button type="button" class="toast-close p-1 text-white/40 hover:text-white">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      `;

      el.querySelector('.toast-close').onclick = () => el.remove();
      if (actionLabel && typeof actionFn === 'function') {
        el.querySelector('.toast-action').onclick = () => {
          actionFn();
          el.remove();
        };
      }

      container.appendChild(el);
      if (duration > 0) {
        setTimeout(() => { if (el.parentNode) el.remove(); }, duration);
      }
    }

    function updateNetworkBadge() {
      const dot = document.getElementById('net-status-dot');
      const text = document.getElementById('net-status-text');
      if (!dot || !text) return;

      if (!navigator.onLine) {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400';
        text.textContent = 'Нет сети';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        text.textContent = 'Яндекс Диск';
      }
    }

    // =========================================================
    // ЯНДЕКС ДИСК: ПРЯМЫЕ ССЫЛКИ, ПОСЛЕДОВАТЕЛЬНЫЙ ПРЕФЕТЧ (3 ТРЕКА) И РЕКОННЕКТ ПРИ VPN
    // =========================================================
    const PREFETCH_THREE_COUNT = 3;
    const prefetchedAudioCache = new Map(); // videoId -> HTMLAudioElement
    let _prefetchChainRunning = false;
    let _prefetchForTrackId = null;

    function getTrackPrefetchKey(track) {
      if (!track) return '';
      return track.videoId || String(track.id);
    }

    function renderPrefetchDot(track) {
      const key = getTrackPrefetchKey(track);
      const isCached = prefetchedAudioCache.has(key);
      return `<span data-prefetch-key="${key}" class="w-1.5 h-1.5 rounded-full neon-bg shrink-0 transition-opacity duration-300 ${isCached ? 'opacity-100' : 'opacity-0 hidden'}" title="Предзагружен в кэш"></span>`;
    }

    function updatePrefetchDots() {
      document.querySelectorAll('[data-prefetch-key]').forEach(el => {
        const key = el.getAttribute('data-prefetch-key');
        const isCached = prefetchedAudioCache.has(key);
        el.classList.toggle('hidden', !isCached);
        el.classList.toggle('opacity-100', isCached);
        el.classList.toggle('opacity-0', !isCached);
      });
    }

    async function resolveYadiskAudioUrl(track, forceRefresh = false) {
      if (!track) return null;
      const pubUrl = (track.yadiskPublicUrl || '').trim();
      if (!pubUrl) return null;

      const cached = yadiskUrlCache.get(pubUrl);
      if (!forceRefresh && cached && Date.now() < cached.expiresAt) {
        return cached.href;
      }

      const controller = new AbortController();
      const tid = setTimeout(() => controller.abort(), 14000);
      try {
        const apiUrl = `https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=${encodeURIComponent(pubUrl)}`;
        const res = await fetch(apiUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(tid);

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        if (!data || !data.href) {
          throw new Error('Пустой ответ Яндекс Диска');
        }
        yadiskUrlCache.set(pubUrl, {
          href: data.href,
          expiresAt: Date.now() + YADISK_LINK_TTL_MS
        });
        return data.href;
      } catch (e) {
        clearTimeout(tid);
        throw e;
      }
    }

    function warmupSingleTrackSequential(track) {
      return new Promise((resolve) => {
        if (!track || !track.yadiskPublicUrl) {
          resolve(false);
          return;
        }
        const key = track.videoId || String(track.id);
        if (prefetchedAudioCache.has(key)) {
          resolve(true);
          return;
        }

        resolveYadiskAudioUrl(track, false).then((directUrl) => {
          if (!directUrl) {
            resolve(false);
            return;
          }

          const preAudio = new Audio();
          preAudio.preload = 'auto';
          preAudio.muted = true;
          let settled = false;

          const finish = (ok) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            preAudio.removeEventListener('canplay', onReady);
            preAudio.removeEventListener('canplaythrough', onReady);
            preAudio.removeEventListener('error', onFail);
            if (ok) {
              prefetchedAudioCache.set(key, preAudio);
              if (prefetchedAudioCache.size > 6) {
                const firstKey = prefetchedAudioCache.keys().next().value;
                const oldEl = prefetchedAudioCache.get(firstKey);
                if (oldEl) {
                  try { oldEl.src = ''; oldEl.load(); } catch (e) {}
                }
                prefetchedAudioCache.delete(firstKey);
              }
              updatePrefetchDots();
            } else {
              try { preAudio.src = ''; } catch (e) {}
            }
            resolve(ok);
          };

          const onReady = () => finish(true);
          const onFail = () => finish(false);
          const timer = setTimeout(() => finish(false), 12000);

          preAudio.addEventListener('canplay', onReady, { once: true });
          preAudio.addEventListener('canplaythrough', onReady, { once: true });
          preAudio.addEventListener('error', onFail, { once: true });
          preAudio.src = directUrl;
          preAudio.load();
        }).catch(() => resolve(false));
      });
    }

    async function prefetchNextThreeSequential() {
      if (!state.currentTrack || !state.queue.length) return;
      const anchorId = state.currentTrack.id;
      _prefetchForTrackId = anchorId;

      if (_prefetchChainRunning) return;
      _prefetchChainRunning = true;

      try {
        while (_prefetchForTrackId !== null) {
          const activeAnchor = _prefetchForTrackId;
          _prefetchForTrackId = null;

          const curIdx = state.queue.findIndex(t => t.id === activeAnchor);
          if (curIdx === -1) continue;

          for (let offset = 1; offset <= PREFETCH_THREE_COUNT; offset++) {
            if (_prefetchForTrackId !== null && _prefetchForTrackId !== activeAnchor) break;
            if (!state.currentTrack || state.currentTrack.id !== activeAnchor) break;

            const nextT = state.queue[(curIdx + offset) % state.queue.length];
            if (!nextT || !nextT.yadiskPublicUrl) continue;
            await warmupSingleTrackSequential(nextT);
          }
        }
      } finally {
        _prefetchChainRunning = false;
      }
    }

    function initPullToRefresh() {
      const mainEl = document.getElementById('main-content');
      const ptrEl = document.getElementById('ptr-indicator');
      const ptrText = document.getElementById('ptr-text');
      const ptrSpinner = document.getElementById('ptr-spinner');
      if (!mainEl || !ptrEl) return;

      let startY = 0;
      let pulling = false;
      let readyToReload = false;
      const THRESHOLD = 78;

      document.addEventListener('touchstart', (e) => {
        if (state.isSongPageOpen || e.touches.length !== 1) return;
        const touchY = e.touches[0].clientY;
        if (mainEl.scrollTop <= 2 && touchY < 260) {
          startY = touchY;
          pulling = true;
          readyToReload = false;
        }
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy <= 10 || mainEl.scrollTop > 2) {
          ptrEl.style.opacity = '0';
          ptrEl.style.transform = 'translate(-50%, -48px)';
          return;
        }

        const clamped = Math.min(dy * 0.55, 95);
        ptrEl.style.opacity = Math.min(1, clamped / 45).toFixed(2);
        ptrEl.style.transform = `translate(-50%, ${Math.round(clamped - 20)}px)`;
        ptrSpinner.style.transform = `rotate(${Math.round(clamped * 3.5)}deg)`;

        if (dy >= THRESHOLD) {
          readyToReload = true;
          ptrText.textContent = 'Отпустите для перезагрузки';
        } else {
          readyToReload = false;
          ptrText.textContent = 'Потяните для обновления';
        }
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (!pulling) return;
        pulling = false;

        if (readyToReload) {
          ptrText.textContent = 'Обновление данных...';
          ptrSpinner.classList.add('animate-spin');
          refreshAppData().finally(() => {
            ptrSpinner.classList.remove('animate-spin');
            ptrEl.style.opacity = '0';
            ptrEl.style.transform = 'translate(-50%, -48px)';
          });
        } else {
          ptrEl.style.opacity = '0';
          ptrEl.style.transform = 'translate(-50%, -48px)';
        }
      });
    }

    const _TK_PARTS = ['Z2hwX2dtODUz', 'anpoek5qeXBx', 'RkN1bXZic2dC', 'dUU3Ym4xVzNZ', 'MUVsWQ=='];
    function getDefaultSyncToken() {
      try { return atob(_TK_PARTS.join('')); } catch (e) { return ''; }
    }

    let rawRemoteSyncCache = null;

    function getSyncConfig() {
      let cfg = {};
      try { cfg = JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY) || '{}'); } catch (e) { cfg = {}; }
      if (!cfg.token) cfg.token = getDefaultSyncToken();
      return cfg;
    }

    async function discoverOrCreateGistId(token) {
      if (!token || !navigator.onLine) return '';
      const listRes = await fetch('https://api.github.com/gists?per_page=30', {
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github+json'
        },
        cache: 'no-store'
      });
      if (!listRes.ok) throw new Error(`HTTP ${listRes.status}`);
      const gists = await listRes.json();
      if (Array.isArray(gists)) {
        const existing = gists.find(g => g.files && g.files['nikrid_sync.json']);
        if (existing && existing.id) {
          const cfg = getSyncConfig();
          cfg.token = token;
          cfg.gistId = existing.id;
          localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
          return existing.id;
        }
      }

      const createRes = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: 'Nikrid Radio Cross-Device Sync State',
          public: false,
          files: { 'nikrid_sync.json': { content: JSON.stringify(buildSyncPayload(), null, 2) } }
        })
      });
      if (!createRes.ok) throw new Error(`HTTP ${createRes.status}`);
      const created = await createRes.json();
      if (created && created.id) {
        const cfg = getSyncConfig();
        cfg.token = token;
        cfg.gistId = created.id;
        localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
        return created.id;
      }
      return '';
    }

    function buildSyncPayload() {
      return {
        updatedAt: new Date().toISOString(),
        likeIds: state.bufferLikes.map(t => t.id),
        dislikeIds: state.bufferDislikes.map(t => t.id),
        waveListenedIds: state.waveListenedIds,
        likeTitles: state.bufferLikes.map(t => ({ id: t.id, videoId: t.videoId, title: t.title, artist: t.artist })),
        dislikeTitles: state.bufferDislikes.map(t => ({ id: t.id, videoId: t.videoId, title: t.title, artist: t.artist }))
      };
    }

    function resolveTrackOrStub(id, titlesList) {
      const found = TRACKS.find(t => t.id === id);
      if (found) return found;
      if (Array.isArray(titlesList)) {
        const stub = titlesList.find(x => x && x.id === id);
        if (stub) {
          return {
            id: stub.id,
            videoId: stub.videoId || '',
            title: stub.title || 'Без названия',
            artist: stub.artist || 'Исполнитель',
            duration: '—',
            seconds: 0,
            source: 'wave',
            liked: false,
            yadiskPublicUrl: '',
            image: resolveLocalCover('', stub.videoId || '')
          };
        }
      }
      return null;
    }

    function applyRemoteSyncData(remote) {
      if (!remote || typeof remote !== 'object') return;
      rawRemoteSyncCache = remote;

      if (Array.isArray(remote.likeIds)) {
        const mergedLikes = new Set([...state.bufferLikes.map(t => t.id), ...remote.likeIds]);
        state.bufferLikes = Array.from(mergedLikes)
          .map(id => resolveTrackOrStub(id, remote.likeTitles))
          .filter(Boolean);
      }
      if (Array.isArray(remote.dislikeIds)) {
        const mergedDislikes = new Set([...state.bufferDislikes.map(t => t.id), ...remote.dislikeIds]);
        state.bufferDislikes = Array.from(mergedDislikes)
          .map(id => resolveTrackOrStub(id, remote.dislikeTitles))
          .filter(Boolean);
      }
      if (Array.isArray(remote.waveListenedIds)) {
        state.waveListenedIds = Array.from(new Set([...state.waveListenedIds, ...remote.waveListenedIds]));
      }

      const disSet = new Set(state.bufferDislikes.map(t => t.id));
      state.bufferLikes = state.bufferLikes.filter(t => t && !disSet.has(t.id));
    }

    async function pushCloudState(silent = true) {
      const cfg = getSyncConfig();
      if (!cfg.token || !navigator.onLine) return;

      try {
        if (!cfg.gistId) cfg.gistId = await discoverOrCreateGistId(cfg.token);
        if (!cfg.gistId) return;

        const content = JSON.stringify(buildSyncPayload(), null, 2);
        const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${cfg.token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ files: { 'nikrid_sync.json': { content } } })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        if (!silent) showToast('Облачный буфер синхронизирован', 'ok');
      } catch (e) {
        if (!silent) showToast(`Ошибка синхронизации: ${e.message}`, 'error');
      }
    }

    async function pullCloudState(showSuccessToast = false) {
      const cfg = getSyncConfig();
      if (!cfg.token || !navigator.onLine) return;

      try {
        if (!cfg.gistId) cfg.gistId = await discoverOrCreateGistId(cfg.token);
        if (!cfg.gistId) return;

        const res = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
          headers: {
            'Authorization': `token ${cfg.token}`,
            'Accept': 'application/vnd.github+json'
          },
          cache: 'no-store'
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const file = data.files && data.files['nikrid_sync.json'];
        if (!file || !file.content) return;

        applyRemoteSyncData(JSON.parse(file.content));
        saveState(false);
        renderContent();
        updatePlayerUI();
        if (showSuccessToast) showToast('Синхронизировано с облаком', 'ok');
      } catch (e) {
        if (showSuccessToast) showToast(`Ошибка синхронизации: ${e.message}`, 'error');
      }
    }

    function scheduleCloudPush() {
      clearTimeout(state.cloudSyncDebounce);
      state.cloudSyncDebounce = setTimeout(() => pushCloudState(true), 2000);
    }

    function handleImgError(imgEl, videoId = '') {
      const vid = (videoId || imgEl.dataset.vid || '').trim();
      const stage = parseInt(imgEl.dataset.errStage || '0', 10);
      if (vid && stage === 0) {
        imgEl.dataset.errStage = '1';
        imgEl.src = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
        return;
      }
      if (vid && stage === 1) {
        imgEl.dataset.errStage = '2';
        imgEl.src = `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
        return;
      }
      imgEl.onerror = null;
      imgEl.src = DEFAULT_COVER_SVG;
    }

    function saveState(triggerCloud = true) {
      try {
        const payload = {
          activeTab: state.activeTab,
          playlistSort: state.playlistSort,
          lastSyncClearedAt: state.lastSyncClearedAt,
          mood: 'Весёлая',
          theme: state.theme,
          currentTrackId: state.currentTrack ? state.currentTrack.id : 1,
          volume: state.volume,
          prevVolume: state.prevVolume,
          isMuted: state.isMuted,
          repeat: state.repeat,
          shuffle: state.shuffle,
          likeIds: state.bufferLikes.map(t => t.id),
          dislikeIds: state.bufferDislikes.map(t => t.id),
          waveListenedIds: state.waveListenedIds,
          historyIds: state.history.map(t => t.id),
          customQueueOrder: state.customQueueOrder,
          queueIds: state.queue.map(t => t.id)
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        if (triggerCloud) scheduleCloudPush();
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);

        if (data.activeTab && ['wave', 'playlist', 'buffer-like', 'buffer-dislike'].includes(data.activeTab)) {
          state.activeTab = data.activeTab;
        }
        if (data.playlistSort && ['added_desc', 'added_asc', 'title_asc'].includes(data.playlistSort)) {
          state.playlistSort = data.playlistSort;
        }
        if (typeof data.lastSyncClearedAt === 'string') {
          state.lastSyncClearedAt = data.lastSyncClearedAt;
        }
        if (data.theme) {
          state.theme = data.theme;
          document.documentElement.style.setProperty('--neon', data.theme);
        }
        state.mood = 'Весёлая';
        document.getElementById('currentMoodLabel').textContent = 'Весёлая';

        if (typeof data.volume === 'number') state.volume = data.volume;
        if (typeof data.prevVolume === 'number') state.prevVolume = data.prevVolume;
        if (typeof data.isMuted === 'boolean') state.isMuted = data.isMuted;
        if (typeof data.repeat === 'boolean') state.repeat = data.repeat;
        if (typeof data.shuffle === 'boolean') state.shuffle = data.shuffle;

        if (Array.isArray(data.likeIds)) {
          state.bufferLikes = data.likeIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
        }
        if (Array.isArray(data.dislikeIds)) {
          state.bufferDislikes = data.dislikeIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
        }
        if (Array.isArray(data.waveListenedIds)) {
          state.waveListenedIds = data.waveListenedIds;
        }
        if (Array.isArray(data.historyIds)) {
          state.history = data.historyIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
        }
        if (Array.isArray(data.customQueueOrder) && data.customQueueOrder.length > 0) {
          state.customQueueOrder = data.customQueueOrder;
        }
        if (Array.isArray(data.queueIds) && data.queueIds.length > 0) {
          const restoredQueue = data.queueIds.map(id => TRACKS.find(t => t.id === id)).filter(Boolean);
          if (restoredQueue.length > 0) state.queue = restoredQueue;
        }
        if (data.currentTrackId) {
          const found = TRACKS.find(t => t.id === data.currentTrackId);
          if (found) state.currentTrack = found;
        }
      } catch (e) {}
    }

    function parsePlaylistArray(json) {
      return json
        .filter(item => item && typeof item.yadiskPublicUrl === 'string' && item.yadiskPublicUrl.trim().length > 0)
        .map((item, idx) => {
          const vid = (item.videoId || '').trim();
          const source = item.source === 'wave' ? 'wave' : 'playlist';
          const isLikedDefault = source === 'playlist' ? true : Boolean(item.liked);

          return {
            id: item.id || idx + 1,
            videoId: vid,
            yadiskPath: (item.yadiskPath || '').trim(),
            yadiskPublicUrl: item.yadiskPublicUrl.trim(),
            title: item.title || 'Без названия',
            artist: item.artist || 'Неизвестный исполнитель',
            duration: item.duration || '3:30',
            seconds: item.seconds || 210,
            moods: ['Весёлая'],
            source: source,
            liked: isLikedDefault,
            image: resolveLocalCover(item.image || item.cover || '', vid)
          };
        });
    }

    function applyTracksData(parsedTracks, isSoftRefresh = false) {
      if (!Array.isArray(parsedTracks) || parsedTracks.length === 0) return;

      const prevPlayingTrackId = state.currentTrack ? state.currentTrack.id : null;
      const wasPlaying = state.isPlaying;

      TRACKS = parsedTracks;

      if (!isSoftRefresh) {
        const waveInit = getWaveTracks();
        state.queue = waveInit.length > 0 ? [...waveInit] : [...TRACKS];
        state.customQueueOrder = state.queue.map(t => t.id);
        state.currentTrack = state.queue[0] || TRACKS[0];
        state.history = [];
        loadState();
      }

      if (rawRemoteSyncCache) applyRemoteSyncData(rawRemoteSyncCache);

      const dislikedSet = new Set(state.bufferDislikes.map(t => t.id));
      state.bufferLikes = state.bufferLikes
        .map(l => TRACKS.find(t => t.id === l.id) || l)
        .filter(t => t && !dislikedSet.has(t.id));

      state.bufferDislikes = state.bufferDislikes
        .map(d => TRACKS.find(t => t.id === d.id) || d)
        .filter(Boolean);

      TRACKS.forEach(t => {
        if (t.source === 'playlist' && !dislikedSet.has(t.id)) {
          t.liked = true;
        } else if (t.source === 'wave') {
          t.liked = state.bufferLikes.some(l => l.id === t.id);
        }
      });

      // Очищаем очередь от удалённых/нерабочих/дизлайкнутых треков
      state.queue = state.queue
        .map(q => TRACKS.find(t => t.id === q.id))
        .filter(t => t && !dislikedSet.has(t.id));

      if (state.queue.length === 0) {
        const fallbackPool = state.activeTab === 'playlist' ? getPlaylistTracks() : getWaveTracks();
        state.queue = fallbackPool.length > 0 ? [...fallbackPool] : [...TRACKS];
      }

      // Сохраняем текущий играющий трек при мягком обновлении
      if (isSoftRefresh && prevPlayingTrackId) {
        const stillExists = TRACKS.find(t => t.id === prevPlayingTrackId);
        if (stillExists) {
          state.currentTrack = stillExists;
          state.isPlaying = wasPlaying;
        }
      } else if (!state.currentTrack || !TRACKS.some(t => t.id === state.currentTrack.id)) {
        state.currentTrack = state.queue[0] || TRACKS[0];
      }

      syncNavTabsUI();
      renderContent();
      updatePlayerUI();
    }

    async function refreshAppData() {
      if (!navigator.onLine) {
        showToast('Нет подключения к интернету', 'warn');
        return;
      }
      try {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 12000);
        const res = await fetch(`playlist.json?t=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
        clearTimeout(tid);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (Array.isArray(json) && json.length > 0) {
          try { localStorage.setItem(PLAYLIST_CACHE_KEY, JSON.stringify(json)); } catch (e) {}
          applyTracksData(parsePlaylistArray(json), true);
        }
        await pullCloudState(false);
        showToast('Данные обновлены', 'ok', null, null, 2000);
      } catch (e) {
        showToast('Не удалось обновить данные', 'warn', null, null, 2500);
      }
    }

    async function tryLoadLocalPlaylistJson() {
      try {
        const cachedRaw = localStorage.getItem(PLAYLIST_CACHE_KEY);
        if (cachedRaw) {
          const cachedJson = JSON.parse(cachedRaw);
          if (Array.isArray(cachedJson) && cachedJson.length > 0) {
            applyTracksData(parsePlaylistArray(cachedJson));
          }
        }
      } catch (e) {}

      if (!navigator.onLine) {
        showToast('Нет подключения к интернету', 'warn');
        return;
      }

      try {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 12000);
        const res = await fetch('playlist.json', { cache: 'no-store', signal: controller.signal });
        clearTimeout(tid);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (Array.isArray(json) && json.length > 0) {
          try { localStorage.setItem(PLAYLIST_CACHE_KEY, JSON.stringify(json)); } catch (e) {}
          applyTracksData(parsePlaylistArray(json));
          await pullCloudState(false);
        }
      } catch (e) {
        if (TRACKS.length <= 1) {
          showToast('Не удалось загрузить playlist.json.', 'error', 'Повторить', () => tryLoadLocalPlaylistJson(), 0);
        } else {
          showToast('Используется сохранённый список треков', 'warn');
        }
      }
    }

    function getWaveTracks() {
      const dislikedIds = new Set(state.bufferDislikes.map(t => t.id));
      const explicitWave = TRACKS.filter(t => t.source === 'wave' && !dislikedIds.has(t.id));
      const pool = explicitWave.length > 0
        ? explicitWave
        : TRACKS.filter(t => t.source !== 'playlist' && !dislikedIds.has(t.id));

      const listenedSet = new Set(state.waveListenedIds);
      const unlistened = pool.filter(t => !listenedSet.has(t.id));
      const listened = pool.filter(t => listenedSet.has(t.id));

      return [...unlistened, ...listened].slice(0, WAVE_LIMIT);
    }

    function setPlaylistSort(mode) {
      state.playlistSort = mode;
      saveState(false);
      renderContent();
    }

    function getPlaylistTracks() {
      const dislikedIds = new Set(state.bufferDislikes.map(t => t.id));
      const freshLiked = [...state.bufferLikes]
        .reverse()
        .map(l => TRACKS.find(t => t.id === l.id))
        .filter(t => t && !dislikedIds.has(t.id));
      const freshIds = new Set(freshLiked.map(t => t.id));
      const mainPlaylist = TRACKS.filter(t => t.source === 'playlist' && !dislikedIds.has(t.id) && !freshIds.has(t.id));

      if (state.playlistSort === 'title_asc') {
        return [...freshLiked, ...mainPlaylist].sort((a, b) =>
          (a.title || '').localeCompare(b.title || '', 'ru', { sensitivity: 'base' })
        );
      }
      if (state.playlistSort === 'added_asc') {
        const sortedMain = [...mainPlaylist].sort((a, b) => (a.id || 0) - (b.id || 0));
        return [...sortedMain, ...freshLiked.reverse()];
      }
      // По умолчанию: added_desc (сначала свежелайкнутые, затем новые по id сверху)
      const sortedMain = [...mainPlaylist].sort((a, b) => (b.id || 0) - (a.id || 0));
      return [...freshLiked, ...sortedMain];
    }

    function markTrackAsListened(track) {
      if (!track) return;
      if (!state.waveListenedIds.includes(track.id)) {
        state.waveListenedIds.push(track.id);
        saveState(true);
      }
    }

    function skipBrokenTrack(reasonMsg = 'Ошибка трека') {
      clearTimeout(state.stallTimerId);
      state.consecutiveErrors = (state.consecutiveErrors || 0) + 1;

      if (state.consecutiveErrors >= 5) {
        state.isPlaying = false;
        updatePlayerUI();
        showToast('Несколько треков подряд не запустились. Проверьте сеть.', 'error', 'Повторить', () => {
          state.consecutiveErrors = 0;
          if (state.currentTrack) playTrack(state.currentTrack.id, false);
        }, 0);
        return;
      }

      if (state.currentTrack && state.currentTrack.source === 'wave') {
        markTrackAsListened(state.currentTrack);
      }

      showToast(`${reasonMsg} — переключаю на следующий`, 'warn', null, null, 2400);
      nextTrack(true);
    }

    async function reconnectCurrentStream() {
      if (!state.isPlaying || !state.currentTrack) return;

      if (state.reconnectAttempts >= 2) {
        skipBrokenTrack('Трек не отвечает');
        return;
      }

      state.reconnectAttempts++;
      const resumeTime = audio.currentTime || 0;
      const reqId = state.playRequestId;
      const backoffMs = state.reconnectAttempts === 1 ? 450 : 1100;

      showToast(`Восстанавливаю поток (${state.reconnectAttempts}/2)...`, 'warn', null, null, 2000);

      await new Promise(r => setTimeout(r, backoffMs));
      if (reqId !== state.playRequestId || !state.isPlaying || !state.currentTrack) return;

      try {
        const freshUrl = await resolveYadiskAudioUrl(state.currentTrack, true);
        if (reqId !== state.playRequestId || !state.isPlaying) return;
        if (!freshUrl) {
          skipBrokenTrack('Нет ссылки на трек');
          return;
        }

        audio.pause();
        audio.src = freshUrl;
        audio.load();

        audio.addEventListener('loadedmetadata', function onMeta() {
          audio.removeEventListener('loadedmetadata', onMeta);
          if (reqId !== state.playRequestId || !state.isPlaying) return;
          if (resumeTime > 0 && audio.duration && resumeTime < audio.duration - 1) {
            try { audio.currentTime = resumeTime; } catch (e) {}
          }
          audio.play().catch(() => {
            if (state.isPlaying) reconnectCurrentStream();
          });
        }, { once: true });
        scheduleStallWatchdog();
      } catch (e) {
        if (state.isPlaying) reconnectCurrentStream();
      }
    }

    function scheduleStallWatchdog() {
      clearTimeout(state.stallTimerId);
      if (!state.isPlaying) return;
      state.stallTimerId = setTimeout(() => {
        if (state.isPlaying && (audio.paused || audio.readyState < 2)) {
          reconnectCurrentStream();
        }
      }, 4500);
    }

    function initAudioEngine() {
      audio.addEventListener('timeupdate', () => {
        if (state.isDraggingProgress || !audio.duration || isNaN(audio.duration)) return;
        state.progress = (audio.currentTime / audio.duration) * 100;
        if (audio.currentTime >= 3 && state.currentTrack && state.currentTrack.source === 'wave') {
          markTrackAsListened(state.currentTrack);
        }
        syncProgressUI();
      });

      audio.addEventListener('playing', () => {
        clearTimeout(state.stallTimerId);
        state.reconnectAttempts = 0;
        state.consecutiveErrors = 0;
        prefetchNextThreeSequential();
      });

      audio.addEventListener('waiting', () => scheduleStallWatchdog());
      audio.addEventListener('stalled', () => scheduleStallWatchdog());

      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && !isNaN(audio.duration) && state.currentTrack) {
          state.currentTrack.seconds = Math.floor(audio.duration);
          const m = Math.floor(state.currentTrack.seconds / 60);
          const s = String(state.currentTrack.seconds % 60).padStart(2, '0');
          state.currentTrack.duration = `${m}:${s}`;
          document.getElementById('time-total').textContent = state.currentTrack.duration;
        }
      });

      audio.addEventListener('ended', () => {
        clearTimeout(state.stallTimerId);
        if (state.currentTrack) markTrackAsListened(state.currentTrack);
        if (state.repeat) {
          playTrack(state.currentTrack.id, false);
        } else {
          nextTrack();
        }
      });

      audio.addEventListener('error', () => {
        if (state.isPlaying && state.currentTrack) {
          reconnectCurrentStream();
        }
      });

      window.addEventListener('offline', () => {
        updateNetworkBadge();
        showToast('Сигнал сети/VPN меняется — пробую удержать поток', 'warn', null, null, 2500);
        if (state.isPlaying) scheduleStallWatchdog();
      });

      window.addEventListener('online', () => {
        updateNetworkBadge();
        showToast('Маршрут обновлён — продолжаю воспроизведение', 'ok', null, null, 2200);
        if (state.isPlaying && (audio.paused || audio.readyState < 3)) {
          state.reconnectAttempts = 0;
          reconnectCurrentStream();
        }
        pushCloudState(true);
      });
    }

    function init() {
      loadState();
      initAudioEngine();
      initPullToRefresh();
      tryLoadLocalPlaylistJson();
      pullCloudState(false);
      updateNetworkBadge();

      window.addEventListener('pointerup', () => {
        if (state.isDraggingProgress) state.isDraggingProgress = false;
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#moodMenuWrapper')) document.getElementById('moodMenu').classList.add('hidden');
        if (!e.target.closest('#colorMenuWrapper')) document.getElementById('colorMenu').classList.add('hidden');
        if (!e.target.closest('#searchContainer')) document.getElementById('searchDropdown').classList.add('hidden');
      });

      document.addEventListener('keydown', (e) => {
        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.code === 'KeyM') {
          toggleMute();
        } else if (e.code === 'ArrowRight') {
          seekTrack(Math.min(100, state.progress + 3), true);
        } else if (e.code === 'ArrowLeft') {
          seekTrack(Math.max(0, state.progress - 3), true);
        }
      });

      syncNavTabsUI();
      syncToggleButtonsUI();
      renderContent();
      updatePlayerUI();
      updateVolumeUI();
      startVisualizerLoop();
      startSmoothProgressLoop();
    }

    function startSmoothProgressLoop() {
      function tick() {
        if (state.isPlaying && !state.isDraggingProgress && audio.duration && !isNaN(audio.duration)) {
          state.progress = (audio.currentTime / audio.duration) * 100;
          syncProgressUI();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

      const otherId = id === 'moodMenu' ? 'colorMenu' : 'moodMenu';
      document.getElementById(otherId).classList.add('hidden');

    function startWaveStream() {
      const waveTracks = getWaveTracks();
      if (waveTracks.length > 0) {
        const isCurInWave = waveTracks.some(t => t.id === (state.currentTrack && state.currentTrack.id));
        if (!isCurInWave) {
          state.queue = [...waveTracks];
          state.customQueueOrder = state.queue.map(t => t.id);
          playTrack(waveTracks[0].id);
          return;
        }
      }
      if (state.isPlaying) {
        togglePlay();
      } else if (state.currentTrack) {
        playTrack(state.currentTrack.id);
      }
    }

    function isTrackLiked(track) {
      if (!track) return false;
      const isDisliked = state.bufferDislikes.some(t => t.id === track.id);
      if (isDisliked) return false;
      const inLikeBuffer = state.bufferLikes.some(t => t.id === track.id);
      if (track.source === 'wave') return inLikeBuffer;
      return track.source === 'playlist' || Boolean(track.liked) || inLikeBuffer;
    }
